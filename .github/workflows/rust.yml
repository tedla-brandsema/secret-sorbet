name: rust

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: formatting and lints
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test execution evidence harness
        run: python -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute debug and release workspace tests with native evidence
        run: python .github/scripts/test-evidence.py --target "${{ matrix.target }}" --runner "${{ matrix.os }}"

      - name: Retain native execution metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ matrix.target }}
          path: native-evidence.json
          if-no-files-found: error
          retention-days: 90

  emulated:
    name: emulated ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - target: i686-unknown-linux-gnu
            compiler_package: gcc-i686-linux-gnu
            libc_package: libc6-dev-i386-cross
            linker: i686-linux-gnu-gcc
            emulator: qemu-i386
            sysroot: /usr/i686-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            compiler_package: gcc-arm-linux-gnueabihf
            libc_package: libc6-dev-armhf-cross
            linker: arm-linux-gnueabihf-gcc
            emulator: qemu-arm
            sysroot: /usr/arm-linux-gnueabihf
          - target: s390x-unknown-linux-gnu
            compiler_package: gcc-s390x-linux-gnu
            libc_package: libc6-dev-s390x-cross
            linker: s390x-linux-gnu-gcc
            emulator: qemu-s390x
            sysroot: /usr/s390x-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install target linker, C runtime and user emulator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user ${{ matrix.compiler_package }} ${{ matrix.libc_package }}

      - name: Execute debug and release shared fixtures under emulation
        run: >-
          python .github/scripts/test-evidence.py
          --target "${{ matrix.target }}" --runner ubuntu-24.04
          --emulator "${{ matrix.emulator }}" --linker "${{ matrix.linker }}"
          --sysroot "${{ matrix.sysroot }}"
          --system-package qemu-user --system-package "${{ matrix.compiler_package }}"
          --system-package "${{ matrix.libc_package }}"
          --output emulated-evidence.json

      - name: Retain emulated execution metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulated-evidence-${{ matrix.target }}
          path: emulated-evidence.json
          if-no-files-found: error
          retention-days: 90

  audit:
    name: dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies
        run: cargo audit

      - name: Audit fuzzing dependencies
        run: cargo audit --no-fetch --file fuzz/Cargo.lock

  fuzz:
    name: policy fuzz smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked

      - name: Exercise policy validation and encoding
        run: cargo +nightly fuzz run policy -- -runs=10000
